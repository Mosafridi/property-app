<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Agent Inbox</title>
        <style>
            body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f4f4f4;}
            nav{background:#2c3e50;padding:10px;margin-bottom:20px;display:flex;align-items:center;flex-wrap:wrap;}
            .auth-status{margin-left:auto;color:#fff;display:flex;gap:15px;align-items:center;}
            .auth-status a{margin-right:0;font-weight:bold;}
            nav a{color:#fff;text-decoration:none;margin-right:15px;}
            nav a:hover{text-decoration:underline;}
            h1{color:#2c3e50;}
            form{background:#fff;padding:20px;border-radius:8px;max-width:480px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
            label{display:block;margin-bottom:5px;font-weight:bold;margin-top:12px;color:#2c3e50;}
            input,select{width:100%;padding:10px;margin-bottom:5px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box;}
            button{background:#2c3e50;color:#fff;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;}
            button:hover{background:#1a252f;}
            form button{margin-top:15px;}
            .login-link{display:inline-block;background:#2c3e50;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none;}
            .field-hint{display:block;font-size:12px;color:#888;margin:2px 0 8px;}
            #loginMessage{color:#c0392b;font-weight:bold;max-width:480px;}
            .inbox-header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;max-width:760px;margin-bottom:15px;}
            .inbox-header p{margin:0;color:#333;}
            #requests-container{max-width:760px;}
            .request-card{background:#fff;padding:15px 18px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);margin-bottom:15px;border-left:4px solid #27ae60;}
            .request-card h3{margin:0 0 4px;font-size:16px;color:#2c3e50;}
            .request-card .received{margin:0 0 10px;font-size:12px;color:#888;}
            .request-card .from{margin:0 0 8px;font-size:14px;color:#333;}
            .request-card .message{margin:0;padding:10px;background:#f9f9f9;border-radius:4px;font-size:14px;color:#333;white-space:pre-wrap;overflow-wrap:anywhere;}
            .request-card.unopened{border-left-color:#c0392b;background:#fdedec;}
            .request-card.unopened .warning{margin:0;color:#c0392b;font-weight:bold;font-size:14px;}
        </style>
    </head>
    <body>
        <nav>
            <a href="index.html">Home</a>
            <a href="add.html">Add Listing</a>
            <a href="analytics.html">Analytics</a>
            <a href="inbox.html">Agent Inbox</a>
        </nav>
        <h1>Agent Inbox</h1>

        <!-- Shown until an agent has logged in. The inbox uses the site's one agent login
             (Member 1's login page), so agents log in once for everything. -->
        <div id="loginPanel" style="display:none;">
            <form onsubmit="return false;">
                <p>Viewing requests are stored encrypted. Log in to read the ones sent to you.</p>
                <a href="login.html?next=inbox.html" class="login-link">Log in</a>
            </form>
            <p id="loginMessage"></p>
        </div>

        <!-- Shown once logged in. The requests are filled in by inbox.js from /api/inbox, which
             only ever returns the logged-in agent's own messages. -->
        <div id="inboxPanel" style="display:none;">
            <div class="inbox-header">
                <p id="inboxSummary"></p>
                <button type="button" onclick="logOut()">Log out</button>
            </div>
            <div id="requests-container"></div>
        </div>
        <script src="auth.js"></script>
        <script src="inbox.js"></script>
    </body>
</html>
