<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Property Analytics</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
        <style>
            body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f4f4f4;}
            nav{background:#2c3e50;padding:10px;margin-bottom:20px;}
            nav a{color:#fff;text-decoration:none;margin-right:15px;}
            nav a:hover{text-decoration:underline;}
            h1{color:#2c3e50;}
            .row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
            .tile{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
            .tile h2{margin-top:0;color:#2c3e50;font-size:18px;margin-bottom:15px;}
            .count{font-size:36px;font-weight:bold;color:#2c3e50;text-align:center;margin:10px 0;}
            .empty{text-align:center;color:#999;padding:20px;}
            .chart-container{position:relative;height:280px;}
        </style>
    </head>
    <body>
        <nav>
            <a href="index.html">Home</a>
            <a href="add.html">Add Listing</a>
            <a href="analytics.html">Analytics</a>
            <a href="inbox.html">Agent Inbox</a>
        </nav>
        <h1>Analytics Dashboard</h1>
        <div class="row" style="grid-template-columns:repeat(4,1fr);">
            <div class="tile">
                <h2>Total Listings</h2>
                <div class="count" id="totalCount">0</div>
            </div>
            <div class="tile">
                <h2>Available</h2>
                <div class="count" id="availableCount">0</div>
            </div>
            <div class="tile">
                <h2>For Sale</h2>
                <div class="count" id="saleCount">0</div>
            </div>
            <div class="tile">
                <h2>For Lease</h2>
                <div class="count" id="leaseCount">0</div>
            </div>
        </div>
        <div class="row">
            <div class="tile">
                <h2>Average Price by Area</h2>
                <div class="chart-container">
                    <canvas id="areaChart"></canvas>
                </div>
            </div>
            <div class="tile">
                <h2>Listings by Property Type</h2>
                <div class="chart-container">
                    <canvas id="typeChart"></canvas>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="tile">
                <h2>Listings by Status</h2>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            <div class="tile">
                <h2>Bedrooms vs. Average Price</h2>
                <div class="chart-container">
                    <canvas id="bedroomsChart"></canvas>
                </div>
            </div>
        </div>
        <div class="row" style="grid-template-columns:1fr;">
            <div class="tile">
                <h2>Listings per Agent (Sale vs. Lease)</h2>
                <div class="chart-container">
                    <canvas id="agentChart"></canvas>
                </div>
            </div>
        </div>
        <script src="analytics.js"></script>
    </body>
</html>
